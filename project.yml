name: WatchAccuracyMeter

options:
  bundleIdPrefix: com.chronobeat
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  WatchAccuracyMeter:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/WatchAccuracyMeter
    info:
      path: Sources/WatchAccuracyMeter/Info.plist
      properties:
        CFBundleDisplayName: Watch Accuracy
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: This app uses the microphone to listen to your watch ticking. Audio is processed on your device and is not uploaded.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chronobeat.WatchAccuracyMeter
        DEVELOPMENT_TEAM: QL3EZT5C88
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"

  WatchAccuracyMeterTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/WatchAccuracyMeterTests
    dependencies:
      - target: WatchAccuracyMeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chronobeat.WatchAccuracyMeterTests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  WatchAccuracyMeter:
    build:
      targets:
        WatchAccuracyMeter: all
    test:
      targets:
        - WatchAccuracyMeterTests
